<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160f27"><title>QISHVERSE ✦</title>
<style>
:root{color-scheme:dark;--pink:#ffbfdf;--ink:#160f27;--glass:#ffffff10;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,sans-serif;color:#fff1fa;background:radial-gradient(ellipse at 20% 0%,#54305e 0%,transparent 55%),radial-gradient(ellipse at 90% 65%,#332a64 0%,transparent 55%),#160f27;min-height:100dvh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 15% 18%,#fff 99%,transparent),radial-gradient(2px 2px at 78% 28%,#f8c8e9 99%,transparent),radial-gradient(1px 1px at 40% 73%,#fff 99%,transparent),radial-gradient(1px 1px at 88% 85%,#fff 99%,transparent);background-size:230px 230px;opacity:.5;animation:drift 45s linear infinite}@keyframes drift{to{transform:translateY(-70px)}}.app{max-width:520px;margin:auto;min-height:100dvh;padding:22px 18px 100px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{letter-spacing:.27em;font-size:11px;color:var(--pink);font-weight:800}.moon{font-size:27px}h1{font:500 clamp(31px,9vw,43px)/1.13 Georgia,serif;margin:12px 0;color:#ffe7f6}h2{font:500 30px Georgia,serif;margin:0 0 9px}.sub{color:#d9b9da;font-size:14px;margin:0 0 24px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--pink);font-weight:700}.panel,.tile,.entry{border:1px solid var(--line);background:var(--glass);border-radius:22px;padding:20px;backdrop-filter:blur(10px)}.panel{margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{text-align:left;min-height:130px;cursor:pointer;transition:transform .25s,background .25s}.tile:active,button:active{transform:scale(.97)}.tile .emoji{font-size:30px;display:block;margin-bottom:13px}.tile strong{display:block;font-size:15px}.tile small{color:#d4bad9}.wide{grid-column:span 2;min-height:94px}.wide .emoji{display:inline;margin-right:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#20152eee;border-top:1px solid #ffffff24;backdrop-filter:blur(22px);display:flex;justify-content:space-around;padding:11px 8px calc(12px + env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:#c8abc9;font-size:11px;min-width:54px}.nav span{display:block;font-size:21px}.nav button.active{color:#ffd4ec}.view{animation:appear .35s ease both}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}button{font:inherit;cursor:pointer}button.primary,.smallbtn{border:0;border-radius:15px;padding:13px 18px;background:linear-gradient(135deg,#f4b6da,#bda1f8);color:#29162e;font-weight:800}.smallbtn{padding:9px 13px;font-size:12px}.secondary{border:1px solid #ffffff4a;border-radius:14px;background:#ffffff13;color:#fce6f6;padding:11px 15px}.actions{display:flex;flex-wrap:wrap;gap:9px}.moods{display:flex;justify-content:space-between;gap:6px}.moods button{border:1px solid #ffffff30;background:#ffffff15;border-radius:15px;font-size:26px;padding:9px 6px;flex:1}.moods button.selected{background:#a873a880;border-color:#ffc7e7}.garden{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:15px 5px}.flower{font-size:27px;text-align:center;animation:bloom .5s backwards}@keyframes bloom{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}textarea,input{display:block;width:100%;background:#f9eaf3;color:#4b314b;border:0;border-radius:14px;padding:14px;font:inherit;margin:10px 0}textarea{min-height:180px;resize:vertical}.entry{margin:10px 0}.entry p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#d1b8d6;font-size:12px}.envelope{display:block;width:100%;text-align:left;background:#ffffff13;color:#fff0f9;border:1px solid #ffffff2c;padding:18px;border-radius:17px;margin:10px 0}.letter{background:#fbeaf1;color:#54374c;border-radius:17px;padding:24px;white-space:pre-wrap;line-height:1.85}.sky{position:relative;height:280px;border:1px solid #ffffff30;border-radius:22px;background:radial-gradient(circle at 50% 70%,#42366b,#1b1739);overflow:hidden}.star{position:absolute;border:0;background:transparent;color:#ffe3a4;font-size:28px;text-shadow:0 0 18px #ffc7ea;animation:pulse 3s infinite alternate}@keyframes pulse{to{opacity:.55;transform:scale(.85)}}.gamechoice{display:block;width:100%;margin:10px 0}.status{margin:14px 0;color:#ffd5e9}.footer{margin:30px 0;color:#bea5c8;text-align:center;font-size:11px}.settings{margin-top:22px}.hidden{display:none}body.reduce *,body.reduce *:before{animation:none!important;transition:none!important}
</style></head><body><main class="app"><header class="top"><div class="brand">✦ QISHVERSE</div><div class="moon">☾</div></header><section id="view" class="view"></section><footer class="footer">Made with love, by Zen ♡ · Your private thoughts stay on this device</footer></main><nav class="nav" id="nav"></nav>
<script>
"use strict";
const $=s=>document.querySelector(s),KEY="qishverse_v1",letters={
"Miss Me":"Hi sayang,\n\nIf I could fold the distance between us, I'd be beside you right now. Until then, let this letter be a hug that stays a little longer.\n\nLove, Zen ♡",
"Hard Day":"My Qish,\n\nYou don't need to be sunshine every day. Take your time, rest when you need to, and be gentle with yourself.\n\nLove, Zen ♡",
"Goodnight":"The stars are on night duty now, love. Whatever today was like, you made it through. Sweet dreams, Qish.\n\nLove, Zen ♡",
"Just Because":"No birthday. No anniversary. I just wanted to leave a tiny piece of love for you to find.\n\nLove, Zen ♡"};
let data={entries:[],moods:[],memories:[],gameWins:0},page="home",mood="🌸",letter="",game=0;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==="object"){data={...data,...saved};["entries","moods","memories"].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("Storage unavailable or full. Please export a backup.");return false}}
function el(tag,props={},text=""){const n=document.createElement(tag);Object.entries(props).forEach(([k,v])=>{if(k==="class")n.className=v;else n.setAttribute(k,v)});n.textContent=text;return n}
function add(parent,tag,props,text){const n=el(tag,props,text);parent.append(n);return n}
function button(parent,label,fn,cls="secondary"){const b=add(parent,"button",{class:cls},label);b.onclick=fn;return b}
function shell(title,desc){const v=$("#view");v.replaceChildren();v.className="view";add(v,"div",{class:"eyebrow"},"A LITTLE WORLD OF YOUR OWN");add(v,"h1",{},title);add(v,"p",{class:"sub"},desc);return v}
function panel(v){return add(v,"div",{class:"panel"})}
function nav(){const n=$("#nav");n.replaceChildren();[["home","⌂","Home"],["diary","📔","Diary"],["garden","🌷","Garden"],["stars","✦","Stars"]].forEach(([id,ico,name])=>{const b=add(n,"button",{class:page===id?"active":""});add(b,"span",{},ico);add(b,"small",{},name);b.onclick=()=>go(id)})}
function go(id){page=id;letter="";nav();render();window.scrollTo({top:0,behavior:"instant"})}
function render(){if(page==="home")home();else if(page==="diary")diary();else if(page==="garden")garden();else if(page==="letters")letterView();else if(page==="stars")stars();else if(page==="arcade")arcade();else if(page==="settings")settings()}
function home(){const v=shell("Welcome home, Qish.","Your little universe is waiting for you. ✦");const p=panel(v);add(p,"div",{class:"eyebrow"},"A GENTLE REMINDER");add(p,"p",{},"Every feeling belongs here. Every little memory matters. And you are so, so loved. ♡");const g=add(v,"div",{class:"grid"});[["diary","📔","Dear Diary","Your quiet corner"],["garden","🌷","Mood Garden","Let feelings bloom"],["letters","💌","Love Letters","Words from Zen"],["stars","✨","Our Stars","A sky of memories"],["arcade","🎮","Little Arcade","Play something sweet"]].forEach(([id,emoji,title,desc],i)=>{const b=add(g,"button",{class:"tile"+(i===4?" wide":"")});add(b,"span",{class:"emoji"},emoji);add(b,"strong",{},title);add(b,"small",{},desc);b.onclick=()=>go(id)});const s=add(v,"div",{class:"settings"});button(s,"⚙ Settings & backups",()=>go("settings"))}
function diary(){const v=shell("Dear Diary","A quiet place for thoughts that belong only to you.");const p=panel(v);add(p,"div",{class:"eyebrow"},"WRITE YOUR HEART OUT");const title=add(p,"input",{placeholder:"A title, if you like…",maxlength:"120"});const body=add(p,"textarea",{placeholder:"Dear me…",maxlength:"20000"});button(p,"Save private entry ♡",()=>{if(!body.value.trim())return alert("Write something first, love.");data.entries.unshift({id:Date.now(),title:title.value.trim(),body:body.value,date:new Date().toISOString()});if(save())diary()},"primary");add(v,"h2",{},"Your pages");if(!data.entries.length)add(v,"p",{class:"muted"},"No entries yet. Your first page is waiting.");data.entries.forEach(e=>{const c=add(v,"div",{class:"entry"});add(c,"div",{class:"eyebrow"},new Date(e.date).toLocaleDateString());add(c,"h3",{},e.title||"Untitled thought");add(c,"p",{},e.body);button(c,"Delete entry",()=>{if(confirm("Delete this entry permanently?")){data.entries=data.entries.filter(x=>x.id!==e.id);save();diary()}})})}
function garden(){const v=shell("Mood Garden","Even the cloudy days deserve a flower.");const p=panel(v);add(p,"div",{class:"eyebrow"},"HOW IS YOUR HEART TODAY?");const m=add(p,"div",{class:"moods"});["🥰","😊","🥺","😴","🌧️"].forEach(x=>{const b=button(m,x,()=>{mood=x;garden()},x===mood?"selected":"");b.setAttribute("aria-label","Mood "+x)});const note=add(p,"input",{placeholder:"A little note (optional)",maxlength:"180"});button(p,"Plant today's feeling",()=>{data.moods.unshift({id:Date.now(),mood,note:note.value,date:new Date().toISOString()});if(save())garden()},"primary");const g=add(v,"div",{class:"garden"});data.moods.slice(0,40).forEach((m,i)=>{const f=add(g,"div",{class:"flower"});f.style.animationDelay=(i%12)*.05+"s";f.textContent=({"🥰":"🌹","😊":"🌼","🥺":"🪻","😴":"🌷","🌧️":"🌱"})[m.mood]||"🌸";f.title=(m.note||"A feeling")+" · "+new Date(m.date).toLocaleDateString()});if(!data.moods.length)add(v,"p",{class:"muted"},"Your garden is ready for its first flower.");button(v,"View mood history",()=>{const p=panel(v);data.moods.forEach(m=>add(p,"p",{},m.mood+"  "+new Date(m.date).toLocaleDateString()+"  "+m.note))})}
function letterView(){const v=shell("Letters From Zen","Some words are best kept in little envelopes.");if(letter){const p=add(v,"div",{class:"letter"});p.textContent=letters[letter];button(v,"← Back to envelopes",()=>{letter="";letterView()});return}Object.keys(letters).forEach((k,i)=>button(v,["✉️ ","🫶 ","🌙 ","🎀 "][i]+k,()=>{letter=k;letterView()},"envelope"))}
function stars(){const v=shell("Our Constellation","Every little moment deserves its own star.");const sky=add(v,"div",{class:"sky"});const samples=[{title:"The beginning",body:"Our story is still being written."},...data.memories];samples.slice(0,12).forEach((m,i)=>{const b=add(sky,"button",{class:"star"},"✦");b.style.left=(12+(i*37)%76)+"%";b.style.top=(13+(i*29)%68)+"%";b.onclick=()=>alert(m.title+"\n\n"+m.body)});const p=panel(v);add(p,"div",{class:"eyebrow"},"ADD A PRIVATE STAR");const title=add(p,"input",{placeholder:"A memory title",maxlength:"120"}),body=add(p,"textarea",{placeholder:"What happened?",maxlength:"3000"});body.style.minHeight="90px";button(p,"Place a star ✦",()=>{if(!title.value.trim())return alert("Give your star a name.");data.memories.push({title:title.value,body:body.value});if(save())stars()},"primary")}
function arcade(){const v=shell("Little Arcade","Tiny games, big smiles. ♡");const p=panel(v);const questions=[["What's Zen's favorite thing about Qish?",["Her smile","Her laugh","Everything about her"],2],["Choose our perfect little adventure",["A midnight drive","A cozy movie night","Both, please"],2],["You found a secret star. Who's it for?",["The moon","Qish","The clouds"],1]];const q=questions[game];add(p,"div",{class:"eyebrow"},"GAME "+(game+1)+" OF 3");add(p,"h3",{},q[0]);q[1].forEach((answer,i)=>button(p,answer,()=>{const msg=i===q[2]?"✦ Correct! A little star for you.":"A cute answer! Try another.";const status=$("#gameStatus");status.textContent=msg;if(i===q[2]){data.gameWins++;save()}},"gamechoice secondary"));add(p,"p",{id:"gameStatus",class:"status"},"");button(v,"Next game →",()=>{game=(game+1)%questions.length;arcade()},"primary");add(v,"p",{class:"muted"},"Stars earned: "+data.gameWins)}
function settings(){const v=shell("Your Space","Privacy, backups, and a little peace of mind.");const p=panel(v);add(p,"h3",{},"Device-only storage");add(p,"p",{},"Diary, moods and private memories are stored in this device's Telegram webview/browser storage. They are not sent to Zen or GitHub. Clearing app data, reinstalling Telegram or changing devices can erase them. This version does not encrypt local storage.");button(p,"Export backup ↓",()=>{const blob=new Blob([JSON.stringify({version:1,data},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=el("a",{href:url,download:"qishverse-backup.json"});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)},"primary");const input=add(p,"input",{type:"file",accept:".json,application/json"});input.onchange=async()=>{const f=input.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(parsed.version!==1||!parsed.data||!Array.isArray(parsed.data.entries)||!Array.isArray(parsed.data.moods)||!Array.isArray(parsed.data.memories))throw Error("Invalid backup");if(confirm("Replace all local QISHVERSE data with this backup?")){data={entries:parsed.data.entries,moods:parsed.data.moods,memories:parsed.data.memories,gameWins:Number(parsed.data.gameWins)||0};save();go("home")}}catch(e){alert("Could not read this backup.")}};button(p,"Erase all local data",()=>{if(confirm("Permanently erase your diary, garden, memories and game progress? Export a backup first.")){localStorage.removeItem(KEY);data={entries:[],moods:[],memories:[],gameWins:0};go("home")}});const a=panel(v);add(a,"h3",{},"Comfort settings");button(a,"Toggle reduced motion",()=>document.body.classList.toggle("reduce"));add(a,"p",{class:"muted"},"Backups are not encrypted. Keep exported files private. Sharing a backup shares its contents.")}
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)document.body.classList.add("reduce");
if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}
nav();render();
</script></body></html>
